name: Dragon Quadruped CAD Build

on:
  push:
    branches:
      - feat/dragon-shell-35cm
  workflow_dispatch:

jobs:
  cad-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Build123d
        run: python -m pip install --upgrade pip build123d
      - name: Generate STEP and STL
        run: python module.py
      - name: Upload CAD outputs
        uses: actions/upload-artifact@v4
        with:
          name: xzort-dragon-cad-v2
          path: |
            out/REF/full_assembly.step
            out/PRINT/*.stl
            out/PRINT_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
