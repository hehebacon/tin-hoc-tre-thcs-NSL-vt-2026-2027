<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rescue Robot OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><h1>RESCUE ROBOT OS</h1><span>SEARCH & RESCUE CONTROL // V1</span></div>
  <strong id="mode">OFFLINE</strong>
</header>
<main>
<section class="panel map-panel"><div class="panel-title">MISSION MAP</div><div id="map"></div></section>
<aside>
<section class="panel"><div class="panel-title">OPERATING MODE</div>
<button data-mode="PATROL">PATROL</button>
<button data-mode="RESCUE">SEARCH & RESCUE</button>
<button data-mode="OSINT">PUBLIC DATA</button>
<button data-mode="AUTONOMOUS">AUTONOMOUS</button></section>
<section class="panel"><div class="panel-title">TELEMETRY</div><pre id="status">Connecting...</pre></section>
<section class="panel"><div class="panel-title">EVENT LOG</div><pre id="log"></pre></section>
</aside>
</main>
<script src="app.js"></script>
</body>
</html>
