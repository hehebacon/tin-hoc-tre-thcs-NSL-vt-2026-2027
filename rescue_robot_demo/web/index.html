<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RESCUE ROBOT OS</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>RESCUE ROBOT OS</h1><span>QUADRUPED SEARCH & RESCUE // COMMAND CENTER</span></div><div class="header-right"><span id="connection" class="badge offline">OFFLINE</span><strong id="mode">OFFLINE</strong></div></header>
<main>
<section class="panel map-panel"><div class="panel-title">MISSION MAP / A* NAVIGATION</div><div id="map"></div></section>
<aside>
<section class="panel"><div class="panel-title">MISSION CONTROL</div><div class="mission-row"><input id="missionName" value="SEARCH ALPHA" maxlength="40"><button id="startMission">START</button></div><button id="stopMission">STOP / E-STOP</button><button id="returnHome">RETURN HOME</button><button id="resumeRobot">RESUME</button><button id="resetMission">RESET ROBOT</button></section>
<section class="panel"><div class="panel-title">OPERATING MODE</div><button data-mode="PATROL">PATROL</button><button data-mode="RESCUE">SEARCH & RESCUE</button><button data-mode="OSINT">PUBLIC DATA</button><button data-mode="AUTONOMOUS">AUTONOMOUS</button></section>
<section class="panel"><div class="panel-title">ROBOT TELEMETRY</div><div class="metrics"><div><span>BATTERY</span><b id="battery">--</b></div><div><span>SIGNAL</span><b id="signal">--</b></div><div><span>SPEED</span><b id="speed">--</b></div><div><span>HEADING</span><b id="heading">--</b></div><div><span>PITCH</span><b id="pitch">--</b></div><div><span>ROLL</span><b id="roll">--</b></div><div><span>GPS</span><b id="gps">--</b></div><div><span>STATE</span><b id="state">--</b></div><div><span>TERRAIN</span><b id="terrain">--</b></div><div><span>SLOPE</span><b id="slope">--</b></div><div><span>FUSION</span><b id="fusion">--</b></div></div></section>
<section class="panel"><div class="panel-title">SENSOR + AI DECISION LAYER</div><pre id="sensor">Connecting...</pre></section>
<section class="panel"><div class="panel-title">MISSION EVENTS</div><pre id="events"></pre></section>
</aside>
</main><script src="app.js"></script></body></html>
